# Lancia i test a ogni push su main e a ogni pull request, su un computer Windows pulito di GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run tests
        run: python -m pytest -q
